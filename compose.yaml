services:
  rewards-dashboard:
    image: ghcr.io/mgrimace/rewards-dashboard:latest
    build:
      context: ./rewards-dashboard
    container_name: rewards-dashboard
    restart: unless-stopped
    ports:
      - "8890:8890"
    environment:
      # 脚本控制 API 的地址（scripts/api/server.js）。
      #  - 如果控制 API 在共享 Docker 网络中的容器里运行，
      #    请使用其服务名或容器名，例如：
      #    http://microsoft-rewards-script:3010
      #  - 如果控制 API 在 Docker 宿主机上运行，请使用
      #    http://host.docker.internal:3010，并配置 extra_hosts。
      CONTROL_API_URL: "http://microsoft-rewards-script:3010"

      # 共享令牌，必须与控制 API 的 API_TOKEN 一致。
      # 从 shell 环境或此 compose.yaml 同目录的 .env 文件读取。
      # 仅在控制 API 未设置令牌时才可留空。
      CONTROL_API_TOKEN: "${API_TOKEN}"

      # 设置你的时区，确保每日积分按正确日期归档（例如
      # Europe/Amsterdam）。未设置时默认为 UTC。
      TZ: "America/Toronto"

      # 可选配置。
      # DASHBOARD_TITLE: 'Microsoft Rewards'
      # POLL_MS: '5000'      # 状态轮询间隔；日志通过流式连接接收
      # LOG_REPLAY: '300'    # 流式连接建立时回放的日志行数

    # 面板的积分历史、运行记录、活动和定时任务均保存在
    # ./data/dashboard.sqlite。脚本控制 API 本身不保存状态，
    # 唯一例外是脚本端的 config/schedule.json：仅当脚本端启用了
    # API_ALLOW_SCHEDULE_WRITE，并在面板的定时任务页面使用
    # “脚本容器”调度器时，才会写入此文件。
    volumes:
      - ./data:/data
    security_opt:
      - no-new-privileges:true
